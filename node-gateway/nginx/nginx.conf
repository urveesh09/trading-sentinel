# Define rate limiting zone: 10MB memory, 30 requests per minute per IP
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;

# CRITICAL FIX 2026-07-03 (502 login gateway bug):
# Docker's internal DNS (127.0.0.11) returns container IPs that change on
# restart. Nginx caches DNS at startup by default, so after a gateway
# restart nginx keeps pointing at the OLD IP and gets ECONNREFUSED -> 502.
# Explicit `resolver 127.0.0.11 valid=10s` forces re-resolution on every
# upstream selection. The named upstream (with `server node-gateway:3000`)
# is the only way to make the resolver actually take effect -- a static
# `proxy_pass http://node-gateway:3000` resolves ONCE at config-load.
resolver 127.0.0.11 ipv6=off valid=10s;

upstream node_gateway_upstream {
    zone node_gateway 64k;
    server node-gateway:3000 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 80 default_server;
    # Listening on all interfaces so any tunnel (ngrok, cloudflared, Tailscale
    # Funnel, DDNS) can reach us. server_name _; accepts any Host header.
    server_name _;

    # Gzip Compression for static assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # Security Headers (Nginx level redundancy)
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";

    location / {
        # Apply Rate Limit
        #limit_req zone=api_limit burst=10 nodelay;

        # Use the named upstream so the `resolver` directive re-runs DNS
        # on every request. The OLD form (static hostname in proxy_pass)
        # bypassed the resolver and cached the stale IP forever.
        proxy_pass http://node_gateway_upstream;
        proxy_http_version 1.1;

        # WebSocket Upgrade Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Failover: if node-gateway is briefly unreachable, retry once
        # against a fresh DNS resolution instead of returning 502.
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
    }
}